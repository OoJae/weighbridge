[project]
name = "weighbridge"
version = "0.1.0"
description = "Can you screen a fine-tune's safety without running it? Weights-only and forward-pass safety screens for public Tiny Aya LoRA adapters, with Yoruba and Nigerian Pidgin ground truth."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "torch>=2.4",
  "transformers>=5.15,<5.22",
  "peft>=0.17",
  "safetensors>=0.4",
  "huggingface_hub>=1.5",
  "datasets>=3.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "pyarrow>=15",
  "tqdm>=4.66",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# vLLM only runs on the Linux GPU jobs, never on the Mac.
gpu = ["vllm"]

[project.scripts]
weighbridge = "weighbridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weighbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
