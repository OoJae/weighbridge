# Hugging Face Jobs presets and the spending cap, read by jobs/launch.py (see docs/JOBS.md).
#
# Every launch is charged its WORST CASE (hourly price x timeout) against budget_usd in the private
# ledger PRIVATE_DIR/jobs_ledger.jsonl, and launch.py refuses a job that would take the running total
# over the cap. Dry runs are never charged.

budget_usd: 15.0

# USD per hour, verified by the team on 2026-11-14. A flavor missing from this table cannot be launched,
# because its cost could not be bounded.
prices_usd_per_hour:
  t4-small: 0.40
  l4x1: 0.80
  a10g-small: 1.00
  a10g-large: 1.50
  a100-large: 2.50

# The repository files every job can read, mounted read-only at code_mount. They are copied into a
# content-addressed folder of the private <namespace>/jobs-artifacts bucket, so a running job never
# sees a later edit. Only public code and public panels belong here: private material lives outside the
# repository (common.PRIVATE_DIR) and reaches a job through a private Hub repo instead.
code_mount: /code
code_bundle: [src, jobs, configs, data/panels]

# Environment of every job. The code volume is read-only, so private and artifact folders go to /tmp.
env:
  PYTHONPATH: /code/src:/code/jobs
  WEIGHBRIDGE_PRIVATE_DIR: /tmp/weighbridge/private
  WEIGHBRIDGE_ARTIFACTS_DIR: /tmp/weighbridge/artifacts
  PYTHONUNBUFFERED: "1"

# Two runtimes:
#   uv  - huggingface_hub.run_uv_job on the uv image: `uv run --with <dependencies> <script> <args>`.
#         The script's own PEP 723 header is honoured too, and local files named in the arguments are
#         shipped to /data by run_uv_job.
#   pip - huggingface_hub.run_job on a public image (vLLM): `pip install <dependencies>`, then
#         `python3 /code/<script> <args>`. Local files in the arguments must be inside the code bundle.
images:
  uv: ghcr.io/astral-sh/uv:python3.12-bookworm
  vllm: vllm/vllm-openai:v0.33.0

jobs:
  # A uv script's PEP 723 header is its main dependency list; `dependencies` here are added to it.
  sentinels:
    script: jobs/job_sentinels.py
    runtime: uv
    flavor: l4x1
    timeout: 3h
  probe:
    script: jobs/job_probe.py
    runtime: uv
    flavor: a100-large
    timeout: 1h
    dependencies: [numpy>=1.26]
  sweep:
    script: jobs/job_sweep.py
    runtime: pip
    image: vllm
    flavor: a10g-large
    timeout: 4h
    dependencies: [peft>=0.17, pyyaml>=6, pandas>=2.1, pyarrow>=15]
  judge:
    script: jobs/job_judge.py
    runtime: uv
    flavor: l4x1
    timeout: 2h
